[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://example.invalid/maestro"

[workspace.dependencies]
maestro-core = { path = "crates/maestro-core" }
maestro-config = { path = "crates/maestro-config" }
maestro-editor = { path = "crates/maestro-editor" }
maestro-tui = { path = "crates/maestro-tui" }
maestro-git = { path = "crates/maestro-git" }

ropey = "1.6"
unicode-segmentation = "1.12"
unicode-width = "0.2"
crossterm = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
anyhow = "1"
proptest = "1"
similar = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
