[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/tbosier/maestro"

[workspace.dependencies]
maestro-core = { path = "crates/maestro-core" }
maestro-config = { path = "crates/maestro-config" }
maestro-editor = { path = "crates/maestro-editor" }
maestro-tui = { path = "crates/maestro-tui" }
maestro-protocol = { path = "crates/maestro-protocol" }
maestro-automation = { path = "crates/maestro-automation" }
maestro-git = { path = "crates/maestro-git" }
maestro-lsp = { path = "crates/maestro-lsp" }
maestro-term = { path = "crates/maestro-term" }
maestro-agent = { path = "crates/maestro-agent" }
maestro-tasks = { path = "crates/maestro-tasks" }
maestro-forge = { path = "crates/maestro-forge" }

ropey = "1.6"
unicode-segmentation = "1.12"
unicode-width = "0.2"
crossterm = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
proptest = "1"
similar = "2"
ignore = "0.4"
maestro-syntax = { path = "crates/maestro-syntax" }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.24"
portable-pty = "0.9"
vt100 = "0.18"
agent-client-protocol-schema = { version = "1.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
