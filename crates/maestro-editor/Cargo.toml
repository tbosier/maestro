[package]
name = "maestro-editor"
description = "Editor state, modal commands, keymaps and the command registry for Maestro"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
maestro-core.workspace = true
maestro-config.workspace = true
maestro-git.workspace = true
maestro-lsp.workspace = true
maestro-syntax.workspace = true
regex.workspace = true
thiserror.workspace = true
ignore.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
maestro-agent.workspace = true
maestro-term.workspace = true
maestro-tasks.workspace = true

[dev-dependencies]
proptest.workspace = true
maestro-lsp = { workspace = true, features = ["fake-server"] }
maestro-agent = { workspace = true, features = ["fake-agent"] }

# Runs its own main so the test binary can double as the fake server.
[[test]]
name = "lsp"
harness = false

# Runs its own main so the test binary can double as the fake ACP agent.
[[test]]
name = "agents"
harness = false

[lints]
workspace = true
