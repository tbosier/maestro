# Workstreams. status: done | in-progress | not-started
# owner: "lead" or the agent branch working on it.

[[task]]
id = "m0-core"
title = "Text engine, selections, transactions, undo tree, atomic IO"
crates = ["maestro-core"]
owner = "lead"
status = "done"

[[task]]
id = "m0-tui"
title = "Terminal renderer, Duskfox theme, input, clipboard"
crates = ["maestro-tui", "maestro-config"]
owner = "lead"
status = "done"

[[task]]
id = "m0-modal"
title = "Modal editing, keymaps, command registry, prompts, pickers"
crates = ["maestro-editor"]
owner = "lead"
status = "done"

[[task]]
id = "m1-syntax"
title = "Tree-sitter highlighting and structural selection"
crates = ["maestro-syntax"]
branch = "feat/syntax"
owner = "agent"
status = "done"

[[task]]
id = "m1-navigation"
title = "Gitignore-aware background file finder, workspace search, session restore"
crates = ["maestro-editor"]
branch = "feat/navigation"
owner = "agent"
status = "done"
notes = "Finder, workspace search, picker preview, session restore without splits, recent files. See ROADMAP M1."

[[task]]
id = "m1-lsp"
title = "Async LSP client: diagnostics, goto definition, hover, completion"
crates = ["maestro-lsp", "maestro-editor", "maestro-tui", "maestro-config"]
branch = "feat/lsp"
owner = "agent"
status = "done"
# Done: diagnostics, goto definition, references, hover, incremental sync,
# crash handling, completion (branch feat/completion; see
# docs/editor-model.md). Not in this task: resolve, documentation pane,
# snippet tab stops, signature help, code actions, rename, formatting.

[[task]]
id = "m1-lsp-actions"
title = "LSP rename, formatting, code actions, signature help and workspace edits"
crates = ["maestro-lsp", "maestro-editor", "maestro-tui"]
branch = "feat/lsp-actions"
owner = "agent"
status = "done"
# All-or-nothing workspace edits (versions, ranges, overlaps checked first;
# unopened files become unsaved buffers; file operations refused),
# workspace/applyEdit, rename with prepareRename, formatting and range
# formatting, code actions with resolve and executeCommand, signature
# help. Not in this task: format on save, file operations, snippet edits,
# switching between several signatures.

[[task]]
id = "m2-git"
title = "Git status, diffs and worktree lifecycle"
crates = ["maestro-git", "maestro-editor"]
branch = "feat/git-worktrees"
owner = "agent"
status = "in-progress"
# Done: maestro-git crate (status, line and unified diffs, worktree
# add/list/remove/prune with safety checks, fast-forward and merge-tree
# checks), gutter signs, branch in the status line, :git-status and
# :worktrees pickers. Not started: agent orchestration, review and merge UI.

[[task]]
id = "m3-protocol"
title = "Versioned automation API with headless mode"
crates = ["maestro-protocol", "maestro-automation", "maestro-cli"]
branch = "feat/automation-api"
owner = "agent"
status = "in-progress"
# Done: protocol 1.0 types, server (snapshot, open, text, save, apply_edit
# with version check, history, selections, command.run/list, execute, quit,
# events), --headless, --listen (Unix socket), --remote. See docs/automation.md.
# Open: persistent provenance, Windows named pipe, a wake-up for the
# interactive loop.

[[task]]
id = "m3-proposals"
title = "Edit proposals: review, approval, verification, attributable results"
crates = ["maestro-protocol", "maestro-automation", "maestro-editor", "maestro-tui", "maestro-cli"]
branch = "feat/proposals"
owner = "agent"
status = "done"
# Protocol 1.1: proposal.create/status/list/withdraw, proposal.resolved,
# review overlay (space e, :proposals), apply_at_version on approval,
# verification through maestro-tasks, records in document.history.
# Headless refuses proposals. Not built: rebase of stale proposals,
# multi-file proposals, persistence.

[[task]]
id = "m3-contracts"
title = "Agent task contracts and conflict detection between agents"
crates = ["maestro-editor", "maestro-tui", "maestro-git", "maestro-agent"]
branch = "feat/contracts"
owner = "agent"
status = "done"
# Contracts (@allow/@forbid/@verify/@accept/@contract): sent to the agent,
# ACP writes outside refused, review marks, O to integrate, t runs the
# contract command, stale/failed verification warnings, saved in records.
# Overlap and merge dry runs between agents' worktree snapshots, shown in
# the panel and the integrate dialog. Not built: editing contracts,
# checking acceptance criteria, watching the target branch.

[[task]]
id = "m1-vim"
title = "Vim operator-pending grammar"
crates = ["maestro-editor"]
branch = "feat/vim-profile"
owner = "unassigned"
status = "not-started"

[[task]]
id = "m2-term"
title = "PTY terminals with VT emulation (maestro-term)"
crates = ["maestro-term"]
branch = "feat/term"
owner = "agent"
status = "done"
# Done: Terminal (spawn, write, resize, snapshot, scroll, exit, kill, modes,
# title), key and paste encoding, real PTY tests. The editor panel that uses
# it is separate work.

[[task]]
id = "m2-agent"
title = "Agent providers and the ACP client (maestro-agent)"
crates = ["maestro-agent"]
branch = "feat/agent"
owner = "agent"
status = "done"
# Done: providers (gemini --acp, opencode acp, claude and codex as
# terminal), AcpClient (initialize, session/new, prompt, cancel,
# permissions, updates, stderr, exit, process-group kill), confined fs
