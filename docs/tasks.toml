# initialize works, session/new fails without a Gemini API key.

[[task]]
id = "m2-review"
title = "Review diff, safe integration, verification runner (maestro-git, maestro-tasks)"
crates = ["maestro-git", "maestro-tasks"]
branch = "feat/review"
owner = "agent"
status = "done"

[[task]]
id = "m2-panel"
title = "Agent panel and review screen in the editor"
crates = ["maestro-editor", "maestro-tui", "maestro-config"]
branch = "feat/panel"
owner = "agent"
status = "in-progress"
# Done: agent records, worktree per task, ACP and terminal launch, panel
# (space a, :agents) with C-\ terminal keys, review screen, tests,
# feedback, permissions, reject, archive, integrate, quit confirmation,
# M2 acceptance test and a tmux run with shell-script providers.
# Agent sessions across restarts (feat/agent-sessions): records saved per
